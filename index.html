<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BIN.BANG — Documentary Auto Editor</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #080909;
      color: #eee;
      font-family: Arial, Helvetica, sans-serif;
    }

    .wrap {
      max-width: 1050px;
      margin: auto;
      padding: 42px 24px 100px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 55px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 500;
      letter-spacing: -.8px;
    }

    .small {
      font-size: 12px;
      color: #888;
      line-height: 1.5;
    }

    .drop {
      border: 1px solid #555;
      min-height: 220px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: pointer;
      transition: .2s;
    }

    .drop:hover,
    .drop.drag {
      background: #111;
      border-color: #aaa;
    }

    input[type=file] {
      display: none;
    }

    .files {
      margin-top: 30px;
    }

    .file {
      display: grid;
      grid-template-columns: 1fr 100px;
      padding: 14px 0;
      border-bottom: 1px solid #222;
      font-size: 13px;
    }

    .controls {
      margin-top: 50px;
      border-top: 1px solid #333;
      padding-top: 25px;
    }

    .row {
      display: grid;
      grid-template-columns: 180px 1fr 60px;
      gap: 15px;
      align-items: center;
      margin: 16px 0;
    }

    input[type=range] {
      width: 100%;
    }

    select {
      background: #111;
      color: white;
      border: 1px solid #444;
      padding: 8px;
    }

    button {
      background: white;
      color: black;
      border: 0;
      padding: 16px 22px;
      font-size: 13px;
      cursor: pointer;
      margin-top: 25px;
      margin-right: 8px;
    }

    button.secondary {
      background: #151515;
      color: white;
      border: 1px solid #444;
    }

    button:disabled {
      opacity: .3;
      cursor: default;
    }

    .progressWrap {
      margin-top: 35px;
      display: none;
    }

    .progress {
      height: 2px;
      background: #222;
      margin-top: 10px;
    }

    .bar {
      height: 100%;
      width: 0%;
      background: white;
      transition: width .15s;
    }

    #status {
      font-size: 12px;
      color: #aaa;
    }

    .timeline {
      margin-top: 55px;
      display: none;
    }

    .clip {
      border-top: 1px solid #333;
      padding: 12px 0;
      display: grid;
      grid-template-columns: 50px 1fr 120px 80px;
      gap: 12px;
      font-size: 12px;
    }

    video {
      width: 100%;
      margin-top: 40px;
      background: black;
      max-height: 650px;
    }

    .note {
      margin-top: 60px;
      color: #555;
      font-size: 11px;
      line-height: 1.7;
    }

    @media(max-width:600px) {
      .row {
        grid-template-columns: 1fr;
      }

      .clip {
        grid-template-columns: 40px 1fr;
      }
    }
  </style>
</head>

<body>
<div class="wrap">

<header>
  <div>
    <h1>DOCUMENTARY<br>AUTO EDITOR</h1>
  </div>

  <div class="small">
    BIN.BANG<br>
    ROUGH CUT SYSTEM<br>
    v0.1
  </div>
</header>

<label class="drop" id="drop">
  <input id="files" type="file" accept="video/*" multiple>

  <div>
    DROP FOOTAGE HERE<br><br>
    <span class="small">
      여러 개의 영상을 넣으면<br>
      움직임과 소리를 분석하여 60초 러프컷을 만듭니다.
    </span>
  </div>
</label>

<div class="files" id="fileList"></div>

<div class="controls">

  <div class="row">
    <label>EDIT STYLE</label>

    <select id="style">
      <option value="documentary">Documentary</option>
      <option value="observational">Observational</option>
      <option value="rhythmic">Rhythmic</option>
    </select>

    <span></span>
  </div>

  <div class="row">
    <label>TARGET LENGTH</label>
    <input id="target" type="range" min="20" max="90" value="60">
    <span id="targetValue">60s</span>
  </div>

  <div class="row">
    <label>MOTION IMPORTANCE</label>
    <input id="motionWeight" type="range" min="0" max="100" value="60">
    <span id="motionValue">60</span>
  </div>

  <div class="row">
    <label>AUDIO IMPORTANCE</label>
    <input id="audioWeight" type="range" min="0" max="100" value="75">
    <span id="audioValue">75</span>
  </div>

  <div class="row">
    <label>COLOR INTENSITY</label>
    <input id="colorStrength" type="range" min="0" max="100" value="70">
    <span id="colorValue">70</span>
  </div>

  <button id="analyze">ANALYZE FOOTAGE</button>
  <button id="make" class="secondary" disabled>MAKE ROUGH CUT</button>

</div>

<div class="progressWrap" id="progressWrap">
  <div id="status">READY</div>
  <div class="progress">
    <div class="bar" id="bar"></div>
  </div>
</div>

<div class="timeline" id="timeline">
  <div class="small">SELECTED MOMENTS</div>
  <div id="clips"></div>
</div>

<div id="preview"></div>

<div class="note">
  Processing happens locally in your browser.<br>
  No footage is uploaded to a server.
</div>

</div>

<script type="module">

const fileInput = document.querySelector("#files");
const drop = document.querySelector("#drop");
const fileList = document.querySelector("#fileList");

const analyzeBtn = document.querySelector("#analyze");
const makeBtn = document.querySelector("#make");

const progressWrap = document.querySelector("#progressWrap");
const statusEl = document.querySelector("#status");
const bar = document.querySelector("#bar");

const timeline = document.querySelector("#timeline");
const clipsEl = document.querySelector("#clips");

let files = [];
let analyses = [];
let selected = [];


// ----------------------------------------------------
// UI
// ----------------------------------------------------

function bindRange(id, output, suffix="") {
  const input = document.querySelector(id);
  const out = document.querySelector(output);

  input.oninput = () => {
    out.textContent = input.value + suffix;
  };
}

bindRange("#target","#targetValue","s");
bindRange("#motionWeight","#motionValue");
bindRange("#audioWeight","#audioValue");
bindRange("#colorStrength","#colorValue");


fileInput.onchange = () => {
  files = [...fileInput.files];
  showFiles();
};

drop.ondragover = e => {
  e.preventDefault();
  drop.classList.add("drag");
};

drop.ondragleave = () => {
  drop.classList.remove("drag");
};

drop.ondrop = e => {
  e.preventDefault();

  drop.classList.remove("drag");

  files = [...e.dataTransfer.files]
    .filter(f => f.type.startsWith("video/"));

  showFiles();
};


function showFiles() {

  fileList.innerHTML = "";

  files.forEach((file,i) => {

    const div = document.createElement("div");

    div.className = "file";

    div.innerHTML = `
      <span>${String(i+1).padStart(2,"0")} — ${file.name}</span>
      <span>${(file.size/1024/1024).toFixed(1)} MB</span>
    `;

    fileList.appendChild(div);

  });

}


// ----------------------------------------------------
// VIDEO METADATA
// ----------------------------------------------------

function metadata(file) {

  return new Promise(resolve => {

    const video = document.createElement("video");

    video.preload = "metadata";
    video.src = URL.createObjectURL(file);

    video.onloadedmetadata = () => {

      resolve({
        duration: video.duration,
        width: video.videoWidth,
        height: video.videoHeight
      });

      URL.revokeObjectURL(video.src);

    };

  });

}


// ----------------------------------------------------
// MOTION ANALYSIS
// ----------------------------------------------------

async function analyzeMotion(file, duration) {

  const video = document.createElement("video");

  video.muted = true;
  video.playsInline = true;
  video.src = URL.createObjectURL(file);

  await new Promise(r => video.onloadedmetadata = r);

  const canvas = document.createElement("canvas");

  canvas.width = 160;
  canvas.height = 90;

  const ctx = canvas.getContext("2d", {
    willReadFrequently:true
  });

  const sampleInterval = 1;

  let previous = null;
  let results = [];

  for(let t=0; t<duration; t+=sampleInterval) {

    video.currentTime = t;

    await new Promise(resolve => {

      const done = () => {
        video.removeEventListener("seeked",done);
        resolve();
      };

      video.addEventListener("seeked",done);

    });

    ctx.drawImage(video,0,0,160,90);

    const image =
      ctx.getImageData(0,0,160,90).data;

    if(previous) {

      let diff = 0;

      for(let i=0;i<image.length;i+=16) {

        diff +=
          Math.abs(image[i]-previous[i]) +
          Math.abs(image[i+1]-previous[i+1]) +
          Math.abs(image[i+2]-previous[i+2]);

      }

      results.push({
        time:t,
        motion:diff
      });

    }

    previous = new Uint8ClampedArray(image);

  }

  URL.revokeObjectURL(video.src);

  const max =
    Math.max(...results.map(x=>x.motion),1);

  results.forEach(x=>{
    x.motion /= max;
  });

  return results;

}


// ----------------------------------------------------
// AUDIO ANALYSIS
// ----------------------------------------------------

async function analyzeAudio(file,duration) {

  try {

    const arrayBuffer =
      await file.arrayBuffer();

    const AudioCtx =
      window.AudioContext ||
      window.webkitAudioContext;

    const audioContext =
      new AudioCtx();

    const buffer =
      await audioContext.decodeAudioData(
        arrayBuffer.slice(0)
      );

    const channel =
      buffer.getChannelData(0);

    const rate =
      buffer.sampleRate;

    const results = [];

    const step = rate;

    for(let start=0; start<channel.length; start+=step) {

      let sum = 0;
      let count = 0;

      const end =
        Math.min(start+step,channel.length);

      for(let i=start;i<end;i+=20) {

        sum += channel[i]*channel[i];
        count++;

      }

      const rms =
        Math.sqrt(sum/Math.max(count,1));

      results.push({
        time:start/rate,
        audio:rms
      });

    }

    const max =
      Math.max(...results.map(x=>x.audio),0.0001);

    results.forEach(x=>{
      x.audio /= max;
    });

    await audioContext.close();

    return results;

  }

  catch(e) {

    console.warn(
      "Audio analysis failed:",
      e
    );

    return [];

  }

}


// ----------------------------------------------------
// SCORE MOMENTS
// ----------------------------------------------------

function scoreMoments(motion,audio,duration) {

  const motionWeight =
    Number(document.querySelector("#motionWeight").value)/100;

  const audioWeight =
    Number(document.querySelector("#audioWeight").value)/100;

  const moments = [];

  for(let t=1;t<duration-2;t++) {

    const m =
      motion.find(x=>Math.abs(x.time-t)<0.6);

    const a =
      audio.find(x=>Math.abs(x.time-t)<0.6);

    const motionScore =
      m ? m.motion : 0;

    const audioScore =
      a ? a.audio : 0;

    // 너무 극단적인 움직임은 흔들림일 가능성이 있음
    const stableMotion =
      motionScore > .92
      ? motionScore*.45
      : motionScore;

    const score =
      stableMotion*motionWeight +
      audioScore*audioWeight;

    moments.push({
      time:t,
      motion:motionScore,
      audio:audioScore,
      score
    });

  }

  return moments;

}


// ----------------------------------------------------
// ANALYZE ALL FOOTAGE
// ----------------------------------------------------

analyzeBtn.onclick = async () => {

  if(!files.length) {

    alert("영상을 먼저 넣어줘.");
    return;

  }

  analyses = [];

  progressWrap.style.display="block";

  for(let i=0;i<files.length;i++) {

    const file = files[i];

    statusEl.textContent =
      `ANALYZING ${i+1}/${files.length} — ${file.name}`;

    bar.style.width =
      `${(i/files.length)*100}%`;

    const meta =
      await metadata(file);

    const motion =
      await analyzeMotion(
        file,
        meta.duration
      );

    const audio =
      await analyzeAudio(
        file,
        meta.duration
      );

    const moments =
      scoreMoments(
        motion,
        audio,
        meta.duration
      );

    analyses.push({
      file,
      ...meta,
      moments
    });

  }

  bar.style.width="100%";

  statusEl.textContent =
    "ANALYSIS COMPLETE";

  makeBtn.disabled=false;

};


// ----------------------------------------------------
// DOCUMENTARY EDIT LOGIC
// ----------------------------------------------------

function makeDocumentarySelection() {

  const target =
    Number(document.querySelector("#target").value);

  const style =
    document.querySelector("#style").value;

  let candidates = [];

  analyses.forEach((analysis,fileIndex)=>{

    analysis.moments.forEach(m=>{

      let duration;

      if(style==="observational") {

        duration =
          5 + m.audio*5;

      }

      else if(style==="rhythmic") {

        duration =
          1.8 + Math.random()*2.5;

      }

      else {

        // Documentary
        duration =
          m.audio > .45
          ? 6 + m.audio*4
          : 2.5 + m.motion*3;

      }

      candidates.push({

        fileIndex,

        start:
          Math.max(
            0,
            m.time-duration*.3
          ),

        duration,

        score:m.score,

        motion:m.motion,

        audio:m.audio

      });

    });

  });


  // Best moments first
  candidates.sort(
    (a,b)=>b.score-a.score
  );


  let chosen = [];
  let total = 0;

  const usedPerFile =
    new Map();


  for(const c of candidates) {

    if(total >= target)
      break;


    // 같은 영상에서 너무 많이 가져오지 않음
    const used =
      usedPerFile.get(c.fileIndex) || 0;

    if(used > target*.35)
      continue;


    // 같은 시간대 중복 방지
    const overlap =
      chosen.some(x => {

        if(x.fileIndex !== c.fileIndex)
          return false;

        return Math.abs(
          x.start-c.start
        ) < 7;

      });

    if(overlap)
      continue;


    let duration =
      Math.min(
        c.duration,
        target-total
      );


    if(duration < 1)
      continue;


    chosen.push({
      ...c,
      duration
    });


    total += duration;

    usedPerFile.set(
      c.fileIndex,
      used+duration
    );

  }


  // 영상별로 뭉치지 않도록 순서 재구성
  const result = [];

  let lastFile = -1;

  while(chosen.length) {

    let index =
      chosen.findIndex(
        x=>x.fileIndex!==lastFile
      );

    if(index===-1)
      index=0;

    const clip =
      chosen.splice(index,1)[0];

    result.push(clip);

    lastFile =
      clip.fileIndex;

  }


  return result;

}


// ----------------------------------------------------
// DISPLAY ROUGH CUT
// ----------------------------------------------------

makeBtn.onclick = () => {

  selected =
    makeDocumentarySelection();

  clipsEl.innerHTML="";

  timeline.style.display="block";

  let total=0;

  selected.forEach((clip,i)=>{

    total += clip.duration;

    const analysis =
      analyses[clip.fileIndex];

    const row =
      document.createElement("div");

    row.className="clip";

    row.innerHTML=`

      <span>
        ${String(i+1).padStart(2,"0")}
      </span>

      <span>
        ${analysis.file.name}
      </span>

      <span>
        ${formatTime(clip.start)}
        →
        ${formatTime(
          clip.start+clip.duration
        )}
      </span>

      <span>
        ${(clip.score*100).toFixed(0)}
      </span>

    `;

    clipsEl.appendChild(row);

  });

  statusEl.textContent =
    `ROUGH CUT — ${total.toFixed(1)} SEC`;

  createBrowserPreview();

};


// ----------------------------------------------------
// BROWSER PREVIEW
// ----------------------------------------------------

async function createBrowserPreview() {

  const preview =
    document.querySelector("#preview");

  preview.innerHTML="";

  const box =
    document.createElement("div");

  box.style.marginTop="50px";

  box.innerHTML=`

    <div class="small">
      ROUGH CUT PLAYBACK
    </div>

    <video
      id="player"
      controls
      playsinline
    ></video>

    <br>

    <button id="playCut">
      PLAY AUTOMATIC CUT
    </button>

  `;

  preview.appendChild(box);


  document.querySelector("#playCut")
    .onclick = async () => {

      const player =
        document.querySelector("#player");

      for(const clip of selected) {

        const file =
          analyses[clip.fileIndex].file;

        const url =
          URL.createObjectURL(file);

        player.src=url;

        await new Promise(
          r=>player.onloadedmetadata=r
        );

        player.currentTime =
          clip.start;

        await player.play();

        await new Promise(resolve=>{

          const end =
            clip.start +
            clip.duration;

          const timer =
            setInterval(()=>{

              if(
                player.currentTime>=end ||
                player.ended
              ){

                clearInterval(timer);

                player.pause();

                URL.revokeObjectURL(url);

                resolve();

              }

            },40);

        });

      }

    };

}


// ----------------------------------------------------
// COLOR PRESET INFORMATION
// ----------------------------------------------------

function getBinBangColorPreset() {

  const strength =
    Number(
      document.querySelector(
        "#colorStrength"
      ).value
    )/100;

  /*
    Target look:

    deep blacks
    cyan / green shadows
    warm highlights
    restrained highlights
    increased saturation
    documentary contrast
  */

  return {

    contrast:
      1 + .28*strength,

    saturation:
      1 + .30*strength,

    brightness:
      1 - .05*strength,

    cyanShadow:
      .14*strength,

    warmHighlight:
      .08*strength

  };

}


// ----------------------------------------------------
// UTIL
// ----------------------------------------------------

function formatTime(sec) {

  const m =
    Math.floor(sec/60);

  const s =
    Math.floor(sec%60);

  return (
    String(m).padStart(2,"0")
    + ":" +
    String(s).padStart(2,"0")
  );

}

</script>
</body>
</html>
